<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enviar alterações — Tábuas Mangangá</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #14110d; color: #f7f1e6;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 22px; }
  .wrap { max-width: 620px; margin: 0 auto; }
  h1 { font-size: 21px; margin: 0 0 6px; }
  .box { background: #1d1913; border: 1.5px solid rgba(255,255,255,.1); border-radius: 16px; padding: 20px; margin-top: 14px; }
  .status { font-size: 16px; line-height: 1.6; }
  .ok { color: #3ecf8e; } .warn { color: #f2b33e; } .err { color: #ff6b6b; }
  .big { font-size: 46px; text-align: center; margin: 6px 0 10px; }
  .count { background: #14110d; border: 2px solid rgba(62,207,142,.5); border-radius: 14px;
    padding: 16px; text-align: center; color: #8be0b0; font-size: 17px; font-weight: 800; margin: 14px 0; }
  button { background: linear-gradient(135deg,#8be0b0,#3ecf8e); color: #0d1a12; border: none;
    border-radius: 12px; padding: 16px 22px; font-size: 16px; font-weight: 800; cursor: pointer; width: 100%; }
  button.ghost { background: rgba(255,255,255,.06); color: #f7f1e6; border: 1px solid rgba(255,255,255,.16); }
  .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,.3);
    border-top-color: #3ecf8e; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -3px; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hint { color: #a89f8f; font-size: 12.5px; line-height: 1.6; margin-top: 17px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📲 Enviar minhas alterações</h1>
  <div class="box">
    <div id="status" class="status"><span class="spinner"></span>Lendo suas alterações…</div>
    <div id="content"></div>
  </div>
  <div class="hint">Use o <b>mesmo celular e mesmo navegador</b> onde você editou o painel.</div>
</div>
<script>
(function () {
  var ENDPOINT = "https://webhook.site/105524e5-5d7d-427f-9f09-ec27a0a8c3f3";
  var statusEl = document.getElementById("status");
  var contentEl = document.getElementById("content");

  function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function parsel(s, d) { try { return JSON.parse(s); } catch (e) { return d; } }

  function send(obj) {
    var body = JSON.stringify(obj);
    try { if (navigator.sendBeacon) navigator.sendBeacon(ENDPOINT, new Blob([body], { type: "text/plain;charset=UTF-8" })); } catch (e) {}
    try { var img = new Image(); img.src = ENDPOINT + "?d=" + encodeURIComponent(body.slice(0, 1800)); } catch (e) {}
    try { fetch(ENDPOINT, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=UTF-8" }, body: body }); } catch (e) {}
    try { fetch(ENDPOINT, { method: "POST", mode: "cors", headers: { "Content-Type": "text/plain;charset=UTF-8" }, body: body, keepalive: true }); } catch (e) {}
  }

  var ovP = get("mng_admin_overrides");
  var ovS = get("mng_admin_site");
  var bak = get("mng_admin_backup");
  var pObj = parsel(ovP, {});
  var sObj = parsel(ovS, {});
  var nProd = Object.keys(pObj.products || {}).length;
  var nCat = Object.keys(pObj.categories || {}).length;
  var nSite = Object.keys(sObj || {}).length;
  var temAlgo = nProd + nCat + nSite > 0;
  var bObj = parsel(bak, null);
  var temBackup = !!(bObj && bObj.products && bObj.products !== "null");

  var diag = {
    app: "mng-leste", ts: Date.now(), url: location.href, ua: navigator.userAgent,
    nProd: nProd, nCat: nCat, nSite: nSite, temBackup: temBackup,
    hasOv: !!ovP, hasSite: !!ovS, hasBak: !!bak,
    keys: (function () { var a = []; try { for (var i = 0; i < localStorage.length; i++) a.push(localStorage.key(i)); } catch (e) {} return a; })()
  };

  if (temAlgo) {
    diag.event = "data";
    diag.products = pObj;
    diag.site = sObj;
  } else {
    diag.event = "empty";
  }
  send(diag);

  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

  if (!temAlgo) {
    statusEl.className = "status warn";
    statusEl.innerHTML = "⚠️ Não encontrei alterações neste aparelho.";
    contentEl.innerHTML = temBackup
      ? "<p style='color:#a89f8f;font-size:13px'>Mas achei um backup. Toque para recuperar e depois recarregue.</p><button id='btnBak'>♻️ Recuperar do backup</button>"
      : "<p style='color:#a89f8f;font-size:13px'>As edições não estão neste navegador. Abra este link no <b>mesmo celular e navegador</b> onde editou o painel.</p>" +
        "<p style='color:#6f6a60;font-size:12px;word-break:break-all'>Diagnóstico enviado. Chaves locais: " + esc(diag.keys.join(", ") || "(nenhuma)") + "</p>";
    var bb = document.getElementById("btnBak");
    if (bb) bb.onclick = function () {
      try {
        var b = parsel(bak, {});
        localStorage.setItem("mng_admin_overrides", b.products);
        if (b.site) localStorage.setItem("mng_admin_site", b.site);
        statusEl.className = "status ok";
        statusEl.innerHTML = "♻️ Recuperado! Recarregando…";
        setTimeout(function () { location.reload(); }, 900);
      } catch (e) { alert("Não deu para recuperar."); }
    };
    return;
  }

  statusEl.className = "status ok";
  statusEl.innerHTML = "✅ Tudo certo!<div class='big'>🎉</div>Suas alterações foram enviadas.";
  contentEl.innerHTML =
    "<div class='count'>" + nProd + " prato(s) · " + nCat + " categoria(s) · " + nSite + " texto(s)</div>" +
    "<div style='color:#a89f8f;font-size:14px;line-height:1.6'>Pode fechar esta página. Volte ao computador e escreva <b>enviei</b>.</div>";
})();
</script>
</body>
</html>
