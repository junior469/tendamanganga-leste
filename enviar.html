<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enviar alterações — Tábuas Mangangá</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #14110d; color: #f7f1e6;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 22px; }
  .wrap { max-width: 620px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #a89f8f; font-size: 14px; line-height: 1.6; margin-bottom: 18px; }
  .box { background: #1d1913; border: 1.5px solid rgba(255,255,255,.1); border-radius: 16px; padding: 18px; }
  .status { font-size: 15px; line-height: 1.6; }
  .ok { color: #3ecf8e; }
  .warn { color: #f2b33e; }
  .err { color: #ff6b6b; }
  .code { font-family: Consolas, monospace; font-size: 34px; font-weight: 900; letter-spacing: 4px;
    color: #8be0b0; text-align: center; padding: 18px 8px; background: #14110d;
    border: 2px solid rgba(62,207,142,.5); border-radius: 14px; margin: 14px 0; word-break: break-all; }
  .link { font-size: 12px; color: #a89f8f; word-break: break-all; }
  button { background: linear-gradient(135deg,#8be0b0,#3ecf8e); color: #0d1a12; border: none;
    border-radius: 12px; padding: 15px 22px; font-size: 16px; font-weight: 800; cursor: pointer; width: 100%; }
  button.ghost { background: rgba(255,255,255,.06); color: #f7f1e6; border: 1px solid rgba(255,255,255,.16); }
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.3);
    border-top-color: #3ecf8e; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -3px; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <h1>📲 Enviar minhas alterações</h1>
  <div class="sub">Esta página pega os pratos que você editou <b>neste celular</b> e envia para a internet, gerando um <b>código</b>. Depois é só me mandar esse código no computador.</div>
  <div class="box">
    <div id="status" class="status"><span class="spinner"></span>Lendo suas alterações…</div>
    <div id="content"></div>
  </div>
</div>
<script>
(function () {
  var statusEl = document.getElementById("status");
  var contentEl = document.getElementById("content");

  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  var ovP = get("mng_admin_overrides");
  var ovS = get("mng_admin_site");
  var bak = get("mng_admin_backup");

  var nProd = 0, nCat = 0, nSite = 0;
  try { var p = JSON.parse(ovP || "{}"); nProd = Object.keys(p.products || {}).length; nCat = Object.keys(p.categories || {}).length; } catch (e) {}
  try { nSite = Object.keys(JSON.parse(ovS || "{}")).length; } catch (e) {}
  var temAlgo = nProd + nCat + nSite > 0;

  var temBackup = false;
  try { var b = JSON.parse(bak || "null"); temBackup = !!(b && b.products && b.products !== "null"); } catch (e) {}

  if (!temAlgo) {
    statusEl.className = "status warn";
    statusEl.innerHTML = "⚠️ Não encontrei alterações neste aparelho.";
    var extra = "";
    if (temBackup) {
      extra = "<p style='color:#a89f8f;font-size:13px'>Mas achei um backup. Toque para recuperar e depois <b>recarregue esta página</b>.</p>" +
              "<button id='btnBak'>♻️ Recuperar do backup</button>";
    } else {
      extra = "<p style='color:#a89f8f;font-size:13px'>Isso significa que as edições não estão neste aparelho/navegador. Abra este link no <b>mesmo celular e mesmo navegador</b> onde você editou o painel.</p>";
    }
    contentEl.innerHTML = extra;
    var bb = document.getElementById("btnBak");
    if (bb) bb.onclick = function () {
      try {
        var b2 = JSON.parse(bak);
        localStorage.setItem("mng_admin_overrides", b2.products);
        if (b2.site) localStorage.setItem("mng_admin_site", b2.site);
        statusEl.className = "status ok";
        statusEl.innerHTML = "♻️ Recuperado! Recarregando…";
        setTimeout(function () { location.reload(); }, 800);
      } catch (e) { alert("Não deu para recuperar."); }
    };
    return;
  }

  statusEl.className = "status ok";
  statusEl.innerHTML = "✅ Encontrei: <b>" + nProd + "</b> prato(s), <b>" + nCat + "</b> categoria(s) e <b>" + nSite + "</b> texto(s). Enviando…";

  var payload = JSON.stringify({
    products: JSON.parse(ovP || "{}"),
    site: JSON.parse(ovS || "{}")
  });

  var body = "content=" + encodeURIComponent(payload) + "&format=url&expiry_days=30";

  fetch("https://dpaste.com/api/v2/", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: body
  })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
    .then(function (txt) {
      var url = (txt || "").trim().replace(/\s+/g, "");
      var code = url.replace(/^.*\//, "");
      if (!code || code.length < 3) throw new Error("resposta inesperada");
      statusEl.className = "status ok";
      statusEl.innerHTML = "✅ Pronto! Suas alterações foram enviadas. Me mande este código no computador:";
      contentEl.innerHTML =
        "<div class='code'>" + esc(code) + "</div>" +
        "<div class='link'>Link: " + esc(url) + "</div>";
    })
    .catch(function (e) {
      statusEl.className = "status err";
      statusEl.innerHTML = "❌ Não consegui enviar automaticamente (" + esc(e.message) + ").";
      contentEl.innerHTML =
        "<p style='color:#a89f8f;font-size:13px'>Tente novamente. Se continuar, use outro método (baixar .json / compartilhar) no painel Admin.</p>" +
        "<button class='ghost' id='btnAgain'>🔄 Tentar de novo</button>";
      var ba = document.getElementById("btnAgain");
      if (ba) ba.onclick = function () { location.reload(); };
    });
})();
</script>
</body>
</html>
